# Git-based Coolify Compose: bundle all Git assets inside Docker images.
# Never use relative file bind mounts: generated Compose lives outside Git.
x-logging: &id001
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  db:
    logging: *id001
    image: chesscoachpal-staging-postgres-init:17.6.1.136
    restart: unless-stopped
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      POSTGRES_DB: postgres
      PGDATABASE: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run sh docker/supabase/generate-secrets.sh}
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      JWT_EXP: ${JWT_EXPIRY:-3600}
    volumes:
    - db-data:/var/lib/postgresql/data
    - db-config:/etc/postgresql-custom
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - postgres
      - -h
      - localhost
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 90s
    build: &id002
      context: .
      dockerfile: docker/supabase/Dockerfile.postgres-init
  auth:
    logging: *id001
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SUPABASE_PUBLIC_URL:?}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:?}@db:5432/postgres
      GOTRUE_SITE_URL: ${APP_URL:?Set the public HTTPS site URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-true}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?}
      GOTRUE_JWT_ISSUER: ${SUPABASE_PUBLIC_URL:?}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP:-true}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_SMTP_ADMIN_EMAIL: ${AUTH_SMTP_ADMIN_EMAIL:-}
      GOTRUE_SMTP_HOST: ${AUTH_SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${AUTH_SMTP_PORT:-2500}
      GOTRUE_SMTP_USER: ${AUTH_SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${AUTH_SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${AUTH_SMTP_SENDER_NAME:-}
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://localhost:9999/health
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  rest:
    logging: *id001
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:?}@db:5432/postgres
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS:-public}
      PGRST_DB_MAX_ROWS: ${PGRST_DB_MAX_ROWS:-1000}
      PGRST_DB_EXTRA_SEARCH_PATH: ${PGRST_DB_EXTRA_SEARCH_PATH:-public}
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:?}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY:-3600}
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_ADMIN_SERVER_PORT: 3001
    healthcheck:
      test:
      - CMD
      - postgrest
      - --ready
      interval: 5s
      timeout: 5s
      retries: 5
  storage:
    logging: *id001
    image: supabase/storage-api:v1.79.31
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY:?}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET:?}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD:?}@db:5432/postgres
      STORAGE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL:?}
      REQUEST_ALLOW_X_FORWARDED_PATH: 'true'
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: ${STORAGE_TENANT_ID:-stub}
      REGION: ${REGION:-stub}
      ENABLE_IMAGE_TRANSFORMATION: 'false'
      S3_PROTOCOL_ACCESS_KEY_ID: ${S3_PROTOCOL_ACCESS_KEY_ID:?run sh docker/supabase/generate-secrets.sh}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${S3_PROTOCOL_ACCESS_KEY_SECRET:?run sh docker/supabase/generate-secrets.sh}
    volumes:
    - storage-data:/var/lib/storage
    healthcheck:
      test:
      - CMD
      - wget
      - --no-verbose
      - --tries=1
      - --spider
      - http://storage:5000/status
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
  gateway:
    logging: *id001
    image: chesscoachpal-staging-gateway:1.30.6
    restart: unless-stopped
    depends_on:
    - auth
    - rest
    - storage
    environment:
      APP_URL: ${APP_URL:?}
    networks:
    - default
    - coolify
    build:
      context: .
      dockerfile: docker/supabase/Dockerfile.gateway
  migrate:
    logging: *id001
    image: chesscoachpal-staging-postgres-init:17.6.1.136
    entrypoint:
    - /bin/bash
    - /migrate.sh
    restart: 'no'
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      DB_HOST: db
      MIGRATIONS_DIR: /migrations
    build: *id002
  app:
    logging: *id001
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL:?}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY:?}
        NEXT_PUBLIC_BETA_ONLY: ${NEXT_PUBLIC_BETA_ONLY:-false}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      gateway:
        condition: service_started
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${SUPABASE_PUBLIC_URL:?Set the API gateway HTTPS URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY:?}
      NEXT_PUBLIC_BETA_ONLY: ${NEXT_PUBLIC_BETA_ONLY:-false}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?}
      NEXT_PUBLIC_SITE_URL: ${APP_URL:?Set the public HTTPS site URL}
      POSTGRES_PASSWORD: ''
      JWT_SECRET: ''
      S3_PROTOCOL_ACCESS_KEY_ID: ''
      S3_PROTOCOL_ACCESS_KEY_SECRET: ''
      MCP_PUBLIC_ORIGIN: ${APP_URL:?}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?Generate a unique 32-byte encryption key}
      MCP_SESSION_ENCRYPTION_KEY: ${MCP_SESSION_ENCRYPTION_KEY:?Generate a separate 32-byte encryption
        key}
      CRON_SECRET: ${CRON_SECRET:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-none}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      BETA_ACCESS_CODE: ${BETA_ACCESS_CODE:-}
      # Same Compose input as auth.GOTRUE_DISABLE_SIGNUP; never a public flag.
      BETA_GOTRUE_SIGNUP_DISABLED: ${DISABLE_SIGNUP:-true}
      BETA_GOTRUE_EMAIL_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      PUSH_ENDPOINT_HOSTS_EXTRA: ${PUSH_ENDPOINT_HOSTS_EXTRA:-}
      LICHESS_OAUTH_CLIENT_ID: ${LICHESS_OAUTH_CLIENT_ID:-}
      CHESSCOACHPAL_DEPLOYMENT: self_hosted
    extra_hosts:
    - ${SUPABASE_HOST_ALIAS:?Set API gateway hostname}:host-gateway
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp
    networks:
    - default
    - coolify
  cron:
    logging: *id001
    image: alpine:3.20
    profiles:
    - cron
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 14 * * *}
    entrypoint:
    - /bin/sh
    - -c
    command:
    - 'echo "$$CRON_SCHEDULE wget -q -O- --header ''Authorization: Bearer $$CRON_SECRET'' http://app:3000/api/cron/event-reminders
      >/proc/1/fd/1 2>&1" > /etc/crontabs/root

      exec crond -f -l 8

      '
volumes:
  db-data: null
  db-config: null
  storage-data: null
networks:
  coolify:
    external: true
