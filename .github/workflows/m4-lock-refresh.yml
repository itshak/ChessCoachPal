name: M4 temporary lockfile refresh
on:
  pull_request:
    paths:
      - 'package.json'
      - '.github/workflows/m4-lock-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(m4): refresh lockfile after removing score renderer dependencies"
            git fetch origin "${{ github.event.pull_request.head.ref }}"
            git rebase "origin/${{ github.event.pull_request.head.ref }}"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          else
            echo "Lockfile unchanged"
          fi
