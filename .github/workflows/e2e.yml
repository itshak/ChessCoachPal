name: E2E

# Playwright smoke suite against a real local stack: Dockerized Supabase
# (migrations + seed) and a production Next build. Slower than unit CI,
# so it runs on PRs and main pushes with cancel-in-progress.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Start local Supabase (migrations + seed)
        run: |
          supabase start
          supabase db reset --yes

      - name: Export Supabase keys to environment
        run: |
          eval "$(supabase status -o env)"
          token_key="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::$token_key"
          echo "::add-mask::${SERVICE_ROLE_KEY:-$SECRET_KEY}"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL:-http://127.0.0.1:54321}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
            echo "TOKEN_ENCRYPTION_KEY=$token_key"
            echo "MCP_PUBLIC_ORIGIN=http://localhost:3000"
            echo "LICHESS_API_ORIGIN=http://127.0.0.1:3999" # CI-only loopback OAuth provider, never production
            echo "EMAIL_PROVIDER=smtp"
            echo "SMTP_HOST=127.0.0.1"
            echo "SMTP_PORT=54325"
            echo "EMAIL_FROM_ADDRESS=notifications@chesscoachpal.test"
          } >> "$GITHUB_ENV"

      - name: Build app
        run: npm run build

      - name: Start app
        run: |
          npm run start &
          npx --yes wait-on --timeout 60000 http://localhost:3000

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        run: npm run test:e2e

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
