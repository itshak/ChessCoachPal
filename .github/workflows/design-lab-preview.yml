name: Design lab preview
on:
  pull_request:
    paths:
      - 'experiments/design-lab/**'
      - 'app/design-lab/**'
      - '.github/workflows/design-lab-preview.yml'
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: experiments/design-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve isolated dependencies
        run: npm install --no-audit --no-fund
      - name: Build preview and report bundle sizes
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test all three foundations
        run: npm test
      - name: Preserve comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-lab-evidence
          path: |
            experiments/design-lab/dist/
            experiments/design-lab/package-lock.json
            experiments/design-lab/test-results/
          if-no-files-found: warn
