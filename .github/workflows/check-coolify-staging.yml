name: Verify Coolify staging release connection
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Check restricted release SSH and staging HTTPS
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Verify SSH release gate without deploying
        shell: bash
        env:
          DEPLOY_KEY: ${{ secrets.COOLIFY_STAGING_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.COOLIFY_STAGING_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.COOLIFY_STAGING_HOST }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$KNOWN_HOSTS"
          test -n "$DEPLOY_HOST"
          umask 077
          key="$RUNNER_TEMP/ccp-staging-key"
          known="$RUNNER_TEMP/ccp-known-hosts"
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$known"
          trap 'rm -f "$key" "$known"' EXIT
          output="$(ssh -T -p 22 -i "$key" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known" \
            -o ConnectTimeout=15 \
            "ccpdeploy@$DEPLOY_HOST" status)"
          echo "$output"
          [[ "$output" == staging\ running:* ]]

      - name: Verify staged website, OAuth metadata and Supabase health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            https://beta.chesscoachpal.com/ -o /dev/null
          curl --fail --silent --show-error --max-time 20 \
            https://beta.chesscoachpal.com/.well-known/oauth-authorization-server -o /dev/null
          curl --fail --silent --show-error --max-time 20 \
            https://api-beta.chesscoachpal.com/auth/v1/health -o /dev/null
          curl --fail --silent --show-error --max-time 20 \
            https://api-beta.chesscoachpal.com/rest/v1/ -o /dev/null
          echo "COOLIFY_STAGING_CONNECTION_AND_HTTPS_OK"
