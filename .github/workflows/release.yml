name: Publish GitHub Release
on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - CHANGELOG.md
      - scripts/release.mjs
      - scripts/release-check.mjs
      - .github/workflows/release.yml
      - scripts/mcp-parity-audit.mjs
      - scripts/mcp-website-parity.json
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: chesscoachpal-release
  cancel-in-progress: false
jobs:
  verify_vercel_credentials:
    name: Verify Vercel production access (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: team_aZxN1BOwcDQOlq3QUY6ljI4r
      VERCEL_PROJECT_ID: prj_44EgXG3SrKoKN3KLPltt7KTVlIrF
    steps:
      - name: Require repository-level Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::error::Missing repository-level VERCEL_TOKEN Actions secret."
            exit 1
          fi
      - name: Checkout (no repository scripts executed)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@65.12.1
      - name: Verify token and target production project without deploying
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -rf .vercel' EXIT
          vercel pull --yes --environment=production
          echo "Vercel production project configuration fetched successfully; no deployment created."

  publish:
    needs: verify_vercel_credentials
    outputs:
      published: ${{ steps.candidate.outputs.publish }}
      tag: v${{ steps.candidate.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check pending release
        id: candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./package.json").version')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == "0.0.0" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # MCP-first is a release gate, never a best-effort documentation goal.
          # The non-strict audit in normal CI can be green with explicit gaps;
          # strict mode rejects ANY ordinary teacher-business route not yet MCP-complete.
          node scripts/mcp-parity-audit.mjs --strict
          node scripts/release.mjs validate "$VERSION"
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "::error::Release must be current main"; exit 1; }
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            test "$(git rev-parse "refs/tags/${TAG}^{commit}")" = "$(git rev-parse HEAD)" || { echo "::error::Never reuse an existing unpublished tag"; exit 1; }
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
      # Fail before creating the tag when Vercel deploy credentials are missing.
      - name: Require Vercel release token
        if: steps.candidate.outputs.publish == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo "::error::Set the VERCEL_TOKEN GitHub Actions secret before publishing a version."
            exit 1
          fi
      - name: Install
        if: steps.candidate.outputs.publish == 'true'
        run: npm ci
      - name: Version-tool tests
        if: steps.candidate.outputs.publish == 'true'
        run: npm run release:check
      - name: Typecheck
        if: steps.candidate.outputs.publish == 'true'
        run: npm run typecheck
      - name: Unit tests
        if: steps.candidate.outputs.publish == 'true'
        run: npm test
      - uses: supabase/setup-cli@v1
        if: steps.candidate.outputs.publish == 'true'
        with:
          version: latest
      - name: Fresh database bootstrap
        if: steps.candidate.outputs.publish == 'true'
        run: |
          supabase start
          supabase db reset --yes
      - name: Configure isolated test environment
        if: steps.candidate.outputs.publish == 'true'
        run: |
          eval "$(supabase status -o env)"
          token_key="$(node -e 'process.stdout.write(require("crypto").randomBytes(32).toString("hex"))')"
          echo "::add-mask::$token_key"
          echo "::add-mask::${SERVICE_ROLE_KEY:-$SECRET_KEY}"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL:-http://127.0.0.1:54321}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY:-$PUBLISHABLE_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
            echo "TOKEN_ENCRYPTION_KEY=$token_key"
          } >> "$GITHUB_ENV"
      - name: Production build
        if: steps.candidate.outputs.publish == 'true'
        run: npm run build
      - name: Start app
        if: steps.candidate.outputs.publish == 'true'
        run: |
          npm run start &
          npx --yes wait-on --timeout 60000 http://localhost:3000
      - name: Playwright Chromium
        if: steps.candidate.outputs.publish == 'true'
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        if: steps.candidate.outputs.publish == 'true'
        env:
          PWA_E2E: "1"
        run: npm run test:e2e
      - name: E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-playwright-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      # First-release recovery and self-host checks are mandatory on the
      # exact candidate commit, not merely green in a previous PR workflow.
      - name: Stop browser-test Supabase before recovery checks
        if: steps.candidate.outputs.publish == 'true'
        run: supabase stop --no-backup
      - name: Recover synthetic data and uploaded bytes in a second clean database
        if: steps.candidate.outputs.publish == 'true'
        env:
          CI: "true"
          M5_SYNTHETIC_RESTORE: "1"
        run: bash scripts/verify-m5-restore.sh
      - name: Stop recovery Supabase before testing the self-host stack
        if: steps.candidate.outputs.publish == 'true'
        run: supabase stop --no-backup
      - name: Verify fresh self-hosted Compose startup and signup
        if: steps.candidate.outputs.publish == 'true'
        env:
          CI: "true"
          M5_SYNTHETIC_COMPOSE: "1"
        run: bash scripts/verify-m5-compose.sh
      - name: Publish tag and release
        if: steps.candidate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo "::error::main changed while release was tested; retry on latest commit"; exit 1; }
          TAG="v${VERSION}"
          node scripts/release.mjs notes "$VERSION" > "$RUNNER_TEMP/release-notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git show-ref --verify --quiet "refs/tags/${TAG}"; then
            git tag -a "$TAG" -m "ChessCoachPal ${TAG}"
            git push origin "refs/tags/${TAG}"
          fi
          args=(release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "ChessCoachPal ${TAG}" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [[ "$VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh "${args[@]}"
          # GitHub provides source-code ZIP and tar.gz for every tagged release.

  deploy_vercel:
    name: Deploy version tag to Vercel production
    needs: publish
    # The normal release job creates the version tag with GITHUB_TOKEN.
    # That tag push cannot trigger a separate on: push: tags workflow.
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    permissions:
      contents: read
    env:
      VERCEL_ORG_ID: team_aZxN1BOwcDQOlq3QUY6ljI4r
      VERCEL_PROJECT_ID: prj_44EgXG3SrKoKN3KLPltt7KTVlIrF
      RELEASE_TAG: ${{ needs.publish.outputs.tag }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - name: Checkout the exact published version tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.publish.outputs.tag }}
          persist-credentials: false

      - name: Verify release tag points to tested commit
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Not a SemVer version tag: $RELEASE_TAG"
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$RELEASE_SHA" ]]; then
            echo "::error::Published tag is not the release-tested commit."
            exit 1
          fi

      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@65.12.1

      - name: Pull Vercel production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production

      - name: Build Vercel production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel build --prod

      - name: Deploy tagged artifact to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prebuilt --prod --yes
