name: CI

# Typecheck + unit tests on every push and PR. The unit suite is pure-logic
# (lib/**/*.test.ts) and runs in under a second — no database or browser
# needed, so this stays fast enough to never be worth skipping.
#
# A second job builds the Docker image when Docker-related paths change, so
# Dockerfile rot is caught without paying for a full image build on every PR.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce ADR-0001 current-schema-only contract
        run: npm run schema:canonical:guard && npm run schema:canonical:guard-test

      - name: Audit MCP-first website and API coverage (baseline; gaps explicitly reported)
        run: npm run mcp:parity:audit

      - name: Enforce zero legacy attendance and financial source references
        run: npm run schema:attendance:strict

      - name: Validate MCP parity PR guard logic
        run: npm run mcp:parity:guard-test

      - name: Enforce same-PR UI/API and MCP parity for teacher surfaces
        if: github.event_name == 'pull_request'
        env:
          PARITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PARITY_HEAD_SHA: ${{ github.sha }}
        run: node scripts/mcp-parity-pr-guard.mjs

      - name: Validate release helpers
        run: npm run release:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Use the locally checked-out git history instead of the GitHub
      # installation's GET /pulls/{number}/files quota. On any uncertainty,
      # build rather than silently skip a Docker regression.
      - name: Check Docker-relevant paths
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$PUSH_BEFORE"
            head="$CURRENT_SHA"
          else
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null ||
             ! git cat-file -e "${head}^{commit}" 2>/dev/null; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git diff --name-only "$base" "$head" > "$RUNNER_TEMP/changed-files"; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eq '^(Dockerfile$|\.dockerignore$|docker-compose\.example\.yml$|docker/|package\.json$|package-lock\.json$|next\.config\.ts$|tsconfig\.json$|postcss\.config\.mjs$|proxy\.ts$|app/|lib/|components/|public/)' "$RUNNER_TEMP/changed-files"; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.filter.outputs.docker == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build image
        if: steps.filter.outputs.docker == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=dummy
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The example references env_file: .env.local, which is gitignored.
      - name: Create placeholder env file
        run: touch .env.local

      - name: Validate example compose renders
        env:
          POSTGRES_PASSWORD: dummy-postgres-password
          JWT_SECRET: dummy-jwt-secret-at-least-32-characters-long
          ANON_KEY: dummy-anon-key
          SERVICE_ROLE_KEY: dummy-service-role-key
          SUPABASE_PUBLIC_URL: http://supabase.localhost:8000
          # Required (no defaults) — see the storage service in the example.
          S3_PROTOCOL_ACCESS_KEY_ID: dummy-s3-access-key-id
          S3_PROTOCOL_ACCESS_KEY_SECRET: dummy-s3-access-key-secret
        run: |
          docker compose -f docker-compose.example.yml config --quiet
          # The cron service only exists under its profile, so a bare `config`
          # never renders it. Validate both.
          docker compose -f docker-compose.example.yml --profile cron config --quiet
