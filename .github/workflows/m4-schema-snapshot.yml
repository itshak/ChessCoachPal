name: M4 schema snapshot (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/m4-schema-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start fresh disposable Supabase
        run: |
          supabase start
          supabase db reset --yes
      - name: Generate schema source and commit for review
        run: |
          supabase db dump --schema public --file supabase/m4-generated-public-schema.sql
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/m4-generated-public-schema.sql
          git commit -m "chore(m4): snapshot current fresh database schema from synthetic CI"
          git fetch origin ${{ github.event.pull_request.head.ref }}
          git rebase origin/${{ github.event.pull_request.head.ref }}
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
