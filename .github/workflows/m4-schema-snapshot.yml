name: M4 schema snapshot (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/m4-schema-snapshot.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start fresh disposable Supabase
        run: |
          supabase start
          supabase db reset --yes
      - name: Remove obsolete music/practice schema from disposable database
        run: |
          container=$(docker ps --format '{{.Names}}' | grep '^supabase_db_' | head -n 1)
          test -n "$container"
          docker exec -i "$container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DROP TABLE IF EXISTS
            public.sheet_music_assignments, public.music_library_items,
            public.note_attempts, public.flashcard_progress,
            public.practice_sessions, public.student_plans, public.plans
          CASCADE;
          DROP TYPE IF EXISTS public.clef_type, public.practice_mode CASCADE;
          ALTER TABLE public.studio_policies
            DROP COLUMN IF EXISTS note_naming_system,
            DROP COLUMN IF EXISTS streaks_enabled,
            DROP COLUMN IF EXISTS streak_count_quiz,
            DROP COLUMN IF EXISTS streak_count_free_practice,
            DROP COLUMN IF EXISTS streak_count_flashcards;
          SQL
      - name: Generate schema source and commit for review
        run: |
          supabase db dump --schema public --file supabase/m4-generated-public-schema.sql
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/m4-generated-public-schema.sql
          if ! git diff --cached --quiet; then
            git commit -m "chore(m4): snapshot cleaned fresh database schema from synthetic CI"
            git fetch origin ${{ github.event.pull_request.head.ref }}
            git rebase origin/${{ github.event.pull_request.head.ref }}
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          else
            echo "Generated snapshot unchanged"
          fi
