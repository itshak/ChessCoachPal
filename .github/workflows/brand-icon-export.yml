name: Temporary approved-brand icon export

on:
  push:
    branches:
      - brand/approved-knight-book-icon
    paths:
      - .github/workflows/brand-icon-export.yml
      - scripts/export-brand-icons.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install icon exporters
        run: python -m pip install "cairosvg>=2.7,<3" "pillow>=11,<13"
      - name: Generate icons from approved lightweight SVG
        run: python scripts/export-brand-icons.py
      - name: Commit generated PNG and ICO assets to review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icon/*.png public/icon/*.ico
          if ! git diff --cached --quiet; then
            git commit -m "Brand: add generated PNG/ICO exports of approved SVG"
            git push
          fi
