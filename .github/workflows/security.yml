name: Security history audit
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Full remote Actions-log/archive review is expensive and GitHub API-rate-limited.
  # Keep it scheduled + available on demand, while the full reachable Git blob
  # secret scan continues on every commit/PR.
  schedule:
    - cron: "23 3 * * 1"
permissions:
  contents: read
  pull-requests: read
  actions: read
jobs:
  reachable-history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Include all accessible branch and pull-request refs
        run: |
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*' '+refs/pull/*/head:refs/remotes/pr/*'
      - name: Scan every reachable Git blob for high-confidence secret patterns
        run: node scripts/audit-m4-history.mjs
      - name: Preserve redacted audit scope and finding paths
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-redacted-git-history-audit
          path: m4-security-audit.json
          retention-days: 7
          if-no-files-found: warn

  actions-history:
    # Scanning *every* historical Actions ZIP on every main push exhausts the
    # GitHub Actions REST token quota during rapid prelaunch development. This
    # exhaustive remote audit remains mandatory weekly and manually runnable;
    # never mark inaccessible ZIPs as clean. The independent reachable-history
    # scan still runs on every PR and main push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.head_ref == 'docs/archive-m4-security'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Scan currently retrievable GitHub Actions logs and artifact ZIPs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/audit-m4-actions-history.mjs
      - name: Preserve redacted historical Actions audit coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-redacted-actions-audit
          path: m4-actions-audit.json
          retention-days: 7
          if-no-files-found: warn
