name: M5 backup-restore smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m5-restore-${{ github.ref }}
  cancel-in-progress: true

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: "true"
      M5_SYNTHETIC_RESTORE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Restore database and uploaded bytes into second clean install
        run: bash scripts/verify-m5-restore.sh
