name: P0 baseline/live-transition convergence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schema-convergence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-db:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      CCP_SYNTHETIC_SCHEMA: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Historical pre-extension snapshot is pinned in source history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Enforce reviewed manifest and migration integrity
        run: node scripts/pre1-schema-guard.mjs && node --test scripts/schema-transition-contract.test.mjs
      - name: Compare clean baseline with preserved populated-data transitions
        run: bash scripts/verify-schema-transition-convergence.sh
