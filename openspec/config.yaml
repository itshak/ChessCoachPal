schema: spec-driven
context: |
  ChessCoachPal is a proprietary-licensed MCP/Plugin-first, centrally operated SaaS
  for chess coaches. ChatGPT and Claude are primary data-entry clients; the web
  application is a secondary but fully capable viewing/editing and secure approval
  surface. Both call the same backend services; ADR-0003 parity is mandatory.
  Teacher UUID is the tenant key; workplaces are typed operational contexts, not
  independent tenants. Use PostgreSQL/Supabase Auth/RLS and tenant-safe composite FKs.
  ADR-0018 expressly excludes customer self-hosting; operator-managed Coolify or
  self-run infrastructure does not create a supported customer self-host edition.
  ADR-0001/0017 require no pre-v1 backward compatibility and exactly one final,
  separately authorized populated-data transition or tested clean rebuild/reimport.
  ADR-0019 and the 2026-11-21 consolidated final-schema OpenSpec are the sole
  unfinished source of pre-production DDL, including Free/Pro entitlement/billing
  foundations, provenance, report publication and remaining feature schema.
  Do not independently add schema in downstream active feature proposals.
  Treat merged source, accepted OpenSpec, release, deployed schema and live client
  acceptance as distinct evidence gates. Do not infer one from another.
  Preserve third-party MIT attribution and current proprietary license.
  No private strategy, unapproved plan limits/prices, secrets, real student/payment
  records or database exports in this public repository.

rules:
  proposal:
    - Separate implemented behavior from proposed functionality.
    - For accepted architecture, distinguish decision approval from unimplemented acceptance; keep scope specific and dependencies explicit.
    - All pre-production DDL is owned by 2026-11-21-consolidate-final-preproduction-saas-schema under ADR-0019. It changes the one baseline; populated-data transitions require separate target-specific ADR-0017 authorization and independent restore.
    - Keep each change narrowly scoped with dependencies, acceptance gates and explicit deferrals.
  specs:
    - Use SHALL and WHEN/THEN acceptance scenarios.
    - Cover retries, permissions, ambiguity and AI outages.
  tasks:
    - Require observable verification before checking tasks complete.
    - Proposals are planning artifacts; do not silently apply database migrations or deploy production resources when writing them.
    - Cite merged commit and passing GitHub Actions test evidence in docs/STATUS.md for development changes.
    - Never require live ChatGPT or Claude accounts in a development spec/task; move live-client acceptance solely to final local v0.1.0 prepublication release gate.
    - Never mark an active change complete based only on an unmerged draft PR.
    - "ADR-0003 is binding: every teacher website business feature must have same-PR MCP tool, registry and authenticated parity tests; no web-only business fields/actions."
    - Release validation must pass the entire current parity registry and all newly added browser/MCP scenarios; historic 93 original cases alone are not exhaustive.
