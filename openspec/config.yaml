schema: spec-driven
context: |
  ChessCoachPal is a proprietary-licensed, self-hostable, agent-first chess
  teaching management application based on CogNote by Andres Jaime Morales.
  Preserve CogNote MIT attribution and third-party notices; ChessCoachPal's own
  code is proprietary according to ADR-0002.
  ChatGPT and Claude tool calls are the primary data input interface.
  The web application uses the same services for viewing and editing.
  Initial persistence uses PostgreSQL, Supabase Auth and RLS.
  A teacher has configurable Workplaces, groups, students, lesson
  sessions and per-student attendance. No board in v0.1.0.
  Current phase is 0.0.0 development. Use ROADMAP-v0.1.0.md for five
  scoped, testable outcomes (Milestones 1, 2 foundation, 3, 4 and 5 automated self-hosting archived; accepted 2b archived, successor final publication release gate active). All pre-release development acceptance uses automated GitHub Actions with synthetic fixtures. Real Codex MCP search/create/enroll has been demonstrated against the hosted synthetic Supabase demo, but actual ChatGPT/Claude vendor-client acceptance is reserved for the final manual local prepublication v0.1.0 sign-off. Public ChatGPT Plugin Directory publication is a separate future workstream. ADR-0001 overrides inherited compatibility
  directions: no CogNote compatibility or pre-1.0 data/API upgrade support.
rules:
  proposal:
    - Separate implemented behavior from proposed functionality.
    - Keep each change narrowly scoped with dependencies, acceptance gates and explicit deferrals.
  specs:
    - Use SHALL and WHEN/THEN acceptance scenarios.
    - Cover retries, permissions, ambiguity and AI outages.
  tasks:
    - Require observable verification before checking tasks complete.
    - Cite merged commit and passing GitHub Actions test evidence in docs/STATUS.md for development changes.
    - Never require live ChatGPT or Claude accounts in a development spec/task; move live-client acceptance solely to final local v0.1.0 prepublication release gate.
    - Never mark an active change complete based only on an unmerged draft PR.
    - ADR-0003 is binding: every teacher website business feature must have same-PR MCP tool, registry and authenticated parity tests; no web-only business fields/actions.
    - Release strict validation must pass all 93 browser/MCP scenarios and have zero partial/gap teacher-business routes.

